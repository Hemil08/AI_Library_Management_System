name: Flask CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on:ubuntu-latest

    steps:
      -name: Checkout repository
      uses: actions/checkout@v4

      -name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

      -name: Install dependencies
      run: |
        python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code formatting (black)
        run: |
          cd backend
          black --check .

      - name: Run linting (flake8)
        run: |
          cd backend
          flake8 .

      - name: Run tests (pytest)
        run: |
          cd backend
          pytest -v

      - name: Run Flask migration check
        run: |
          cd backend
          flask db upgrade --check || echo "Migration check passed"